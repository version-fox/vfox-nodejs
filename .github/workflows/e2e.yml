name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-linux:
    if: github.repository == 'version-fox/vfox-nodejs'
    name: Linux container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose -f tests/e2e/linux/compose.yaml run --rm e2e

  e2e-windows:
    if: github.repository == 'version-fox/vfox-nodejs'
    name: Windows container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        # TODO See https://github.com/actions/runner-images/issues/13729
        runs-on: [windows-latest, windows-11-arm]
        include:
          - runs-on: windows-latest
            compose: tests/e2e/windows/compose.amd64.yaml
          - runs-on: windows-11-arm
            compose: tests/e2e/windows/compose.arm64.yaml
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The windows-11-arm runner ships neither Docker for Windows containers
      # nor a Go new enough to build moby, so both are provisioned here.
      - if: matrix.runs-on == 'windows-11-arm'
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: false
      - if: matrix.runs-on == 'windows-11-arm'
        run: pwsh -NoProfile -File tests/e2e/windows/install-docker-arm64.ps1
      - if: matrix.runs-on == 'windows-11-arm'
        name: Install Compose CLI plugin
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.docker\cli-plugins" | Out-Null
          curl.exe -fsSL "https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-windows-aarch64.exe" -o "$env:USERPROFILE\.docker\cli-plugins\docker-compose.exe"
          docker compose version
      - run: docker compose -f ${{ matrix.compose }} run --rm --build e2e
