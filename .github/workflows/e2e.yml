name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The Linux and WSL jobs run the suite natively, the way the dev container
# runs it locally: Go at the dev container's version (.devcontainer/Dockerfile)
# plus the runner's stock Docker, with the same TESTCONTAINERS_RYUK_DISABLED
# knob. The Windows jobs run tests/e2e/windows/run.ps1, which fetches its own
# pinned Go and tools into a cache dir, so a Windows host needs only Docker.
# See docs/e2e.md.

jobs:
  e2e-linux:
    if: github.repository == 'version-fox/vfox-nodejs'
    name: Linux container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      # Ryuk publishes a port on the host daemon and waits for the suite to
      # dial back to it; the dev container disables it (it runs
      # Docker-out-of-Docker), and CI matches so both paths stay identical.
      # Containers are terminated explicitly via t.Cleanup instead.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: false
      - run: go test -v -timeout 55m -run TestE2E ./linux
        working-directory: tests/e2e

  e2e-linux-musl:
    if: github.repository == 'version-fox/vfox-nodejs'
    name: Linux musl container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Selects the Alpine userland in the Linux suite; the dev container
      # equivalent is the same variable set on the interactive shell.
      E2E_LINUX_BASE: alpine
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: false
      - run: go test -v -timeout 55m -run TestE2E ./linux
        working-directory: tests/e2e

  e2e-windows:
    if: github.repository == 'version-fox/vfox-nodejs'
    name: Windows container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        # TODO See https://github.com/actions/runner-images/issues/13729
        runs-on: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      # Run every combo at once (amd64 has three, arm64 two) instead of the
      # local default of 2, so the slowest combo alone bounds the test phase
      # rather than a queued one running after it (see docs/e2e.md).
      E2E_MAX_JOBS: "3"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The windows-11-arm runner ships neither Docker for Windows containers
      # nor a Go new enough to build moby, so both are provisioned here.
      - if: matrix.runs-on == 'windows-11-arm'
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: false
      - if: matrix.runs-on == 'windows-11-arm'
        run: pwsh -NoProfile -File tests/e2e/windows/install-docker-arm64.ps1
      - run: pwsh -NoProfile -File tests/e2e/windows/run.ps1

  e2e-wsl:
    if: github.repository == 'version-fox/vfox-nodejs'
    name: WSL (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      WSL_DISTRO: Ubuntu-24.04
      NODE_VERSION: 20.16.0
      MIRROR: default
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: false
      # The image ships WSL with --no-distribution: install Ubuntu without
      # launching (launch would prompt for user creation), then boot it once
      # as root. --web-download skips the Store, which CI cannot reach.
      # Regression target: https://github.com/version-fox/vfox-nodejs/issues/32
      - name: Install Ubuntu on WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          wsl --install -d $env:WSL_DISTRO --no-launch --web-download
          # The hosted Windows PATH contains entries with spaces and
          # parentheses (e.g. Program Files (x86)); WSL appends it by default,
          # and `vfox activate` emits an invalid bash export for that PATH.
          # This distro is disposable CI state, so disable Windows PATH
          # interop for a native Linux shell environment.
          wsl -d $env:WSL_DISTRO -u root -- bash -c "printf '[interop]`nappendWindowsPath=false`n' > /etc/wsl.conf"
          wsl --shutdown
          $deadline = (Get-Date).AddMinutes(10)
          do {
            wsl -d $env:WSL_DISTRO -u root -e true
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          } while ((Get-Date) -lt $deadline)
          if ($LASTEXITCODE -ne 0) { throw 'WSL distro did not boot' }
          wsl -l -v
          wsl --version
      - name: Run WSL E2E
        run: go test -v -timeout 55m -run TestE2E ./wsl
        working-directory: tests/e2e
