# Host-side runner for the musl (Alpine) Linux container E2E suite
# (see docs/musl.md and docs/e2e.md).
#
#   docker compose -f tests/e2e/linux/compose.alpine.yaml run --rm e2e
#
# Same Docker-only host requirement as compose.yaml; E2E_LINUX_BASE=alpine
# makes the Go suite build Dockerfile-alpine and assert the musl userland
# before installing Node.js.

services:
  e2e:
    image: golang:1.27.1
    working_dir: /work/tests/e2e
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ../../..:/work
      - e2e-go-modcache:/go/pkg
    environment:
      # See compose.yaml for why Ryuk stays disabled.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      E2E_LINUX_BASE: "alpine"
      E2E_MAX_JOBS: ${E2E_MAX_JOBS:-}
      VFOX_VERSION: ${VFOX_VERSION:-}
      MIRROR: ${MIRROR:-}
      NODE_VERSION: ${NODE_VERSION:-}
      LTS_NODE_VERSION: ${LTS_NODE_VERSION:-}
      E2E_RETRY_ATTEMPTS: ${E2E_RETRY_ATTEMPTS:-}
    command: ["go", "test", "-v", "-timeout", "55m", "-run", "TestE2E", "./linux"]

volumes:
  e2e-go-modcache:
